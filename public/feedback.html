<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Нори — сайт чёрной кошки</title>
  <meta name="keywords" content="кот, кошка, Нори, питомец, портфолио, животные">
  <meta name="description" content="Мини-сайт чёрной кошки Нори — биография, фото, советы по уходу и контактная форма.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css">
</head>
 <script src="feedback.js" defer></script>
<body>

  <header class="site-header">
    <div class="site-header__branding">
      <img class="branding__img" src="images/nori.jpg" alt="Нори — чёрная кошка" width="120" height="120">
      <div class="branding__text">
        <h1 class="branding__title">Нори</h1>
        <p class="branding__subtitle">Чёрная кошка. Любит коробки, солнечных зайчиков и внимание.</p>
      </div>
    </div>

    <nav class="nav" aria-label="Главное меню">
      <ul class="nav__list">
        <li class="nav__item"><a class="nav__link" href="/about">О Нори</a></li>
        <li class="nav__item"><a class="nav__link" href="gallery.html">Фото</a></li>
        <li class="nav__item"><a class="nav__link" href="/">Любимое</a></li>
        <li class="nav__item"><a class="nav__link" href="care.html">Уход</a></li>
        <li class="nav__item"><a class="nav__link" href="stories.html">Истории</a></li>
        <li class="nav__item"><a class="nav__link" href="contacts.html">Контакты</a></li>
        <li class="nav__item"><a class="nav__link" href="feedback.html">Отзывы</a></li>
      </ul>
    </nav>
  </header>

  <main class="page-main">

    <section class="feedback">
  <h2 class="section__title">Оставить отзыв о Нори</h2>

  <form id="feedback-form" class="form">
    <label>Имя</label>
    <input type="text" id="username" required minlength="2">

    <label>Email</label>
    <input type="email" id="email" required>

    <label>Сообщение</label>
    <textarea id="message" required minlength="5"></textarea>

    <button type="submit">Добавить отзыв</button>
  </form>

  <div id="reviews"></div>
</section>


<template id="review-template">
  <article class="review">
    <h3 class="review__name"></h3>
    <p class="review__email"></p>
    <p class="review__text"></p>
    <button class="review__edit">Редактировать</button>
  </article>
</template>

  </main>

  <footer class="site-footer" role="contentinfo">
    <section id="contacts" class="contacts" aria-labelledby="contacts-title">
      <p class="author"><small>Студент: Васильевская Ксения Васильевна — группа: M3312</small></p>
    </section>
  </footer>

 <script src="main.js"></script>

</body>
</html>
